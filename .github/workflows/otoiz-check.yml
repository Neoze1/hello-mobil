name: OTOIZ verification
on: [push, pull_request]
jobs:
  node-checks:
    runs-on: ubuntu-latest
    env:
      VITRA_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Verify document links when available
        run: if [ -f otoiz/scripts/check-docs.mjs ]; then node otoiz/scripts/check-docs.mjs; fi
